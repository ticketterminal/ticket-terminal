name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Signed-off-by on every commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          failed=0
          # Merge commits are exempt; every other commit in the PR needs a sign-off.
          for sha in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            author=$(git show -s --format='%an <%ae>' "$sha")
            if ! git show -s --format=%B "$sha" | grep -qiE '^Signed-off-by: .+ <.+@.+>$'; then
              echo "::error::Commit ${sha:0:7} by $author is missing a Signed-off-by line"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo
            echo "Sign off with 'git commit -s' (or 'git rebase --signoff origin/main')."
            echo "See CONTRIBUTING.md for details."
            exit 1
          fi
          echo "All commits are signed off."
