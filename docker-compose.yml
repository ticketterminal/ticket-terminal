# See the README's "Docker" section before running this. In short: run with
#   UID=$(id -u) GID=$(id -g) docker compose up -d --build
# `.env` must exist (even empty — `touch .env` if you are not using Jira/Notion
# sync) since Compose refuses to start with a referenced env file missing.
services:
  ticket-terminal:
    build: .
    environment:
      - HOME=${HOME}
      - WMP_HOST=0.0.0.0 # safe: see the WMP_HOST comment in server/main.py
    env_file:
      - .env
    ports:
      - "127.0.0.1:4173:4173" # loopback only — never drop the "127.0.0.1:" prefix
    user: "${UID}:${GID}"
    extra_hosts:
      # host.docker.internal is wired up by default on Docker Desktop (macOS/Windows);
      # this line is what makes it resolve on native Linux Docker too, for the
      # optional host-native-agents bridge (README's "Docker" section) — a no-op
      # there if you never set WMP_HOST_BRIDGE_PORT.
      - "host.docker.internal:host-gateway"
    volumes:
      # Ticket workDirs, and ~/.claude, ~/.codex, ~/.ssh, ~/.aws, ~/.kube — whatever
      # the agent needs to run real commands against your real repos, at the same
      # absolute paths a ticket's workDir already stores.
      - ${HOME}:${HOME}
      # The app's own persistent state (workspaces, categories, sessions) — see
      # the README's "Your data" section.
      - ./data:/app/data
